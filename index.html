<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deneme Sitem</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0f172a;
      color: #ffffff;
      text-align: center;
    }
    .card {
      background-color: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      max-width: 90%;
    }
    h1 {
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Merhaba Dünya!</h1>
    <p>Bu site tamamen telefondan yazıldı ve yayınlandı.</p>
  </div>
</body>
</html>
